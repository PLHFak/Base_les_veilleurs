<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>La base monobloc — Les Veilleurs</title>
<link rel="stylesheet" href="lv.css">
</head>
<body>
<div id="gate"></div>
<div id="topbar"></div>
<header id="hdr"></header>
<nav id="nav"></nav>
<main>
  <section id="objet"></section>
  <section id="filieres"></section>
  <section id="ateliers"></section>
  <section id="etapes"></section>
  <section id="documents"></section>
  <section id="journal"></section>
</main>
<footer id="foot"></footer>
<script src="docs/sizes.js"></script>
<script src="data.js"></script>
<script src="lv.js"></script>
<script>
LV.init(window.DATA, "base", ({t, esc}) => {
  const D = window.DATA, $ = s => document.querySelector(s);
  const img = (src, alt, href) => `<a href="${esc(href || src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="${esc(alt || "")}" loading="lazy"></a>`;
  const h2 = (o) => `<h2>${esc(t(o.titre))}${o.sous ? ` <span class="sub">— ${esc(t(o.sous))}</span>` : ""}</h2>`;

  const o = D.objet;
  $("#objet").innerHTML = `${h2(o)}<p class="lead">${esc(t(o.lead))}</p>
    <div class="vues" style="grid-template-columns:repeat(auto-fit,minmax(260px,440px))"><div class="vue">${img(o.rendu, t(o.rendu_leg))}<div class="body"><p>${esc(t(o.rendu_leg))}</p></div></div></div>
    <div class="kv">${o.kv.map(([k, v]) => `<div><b>${esc(t(k))}</b>${esc(t(v))}</div>`).join("")}</div>
    <p><a href="monobloc.html">${esc(t(o.maquette))} ↗</a> — ${esc(t(o.maquette_leg))}</p>`;

  const F = D.filieres;
  $("#filieres").innerHTML = `${h2(F)}<p class="lead">${esc(t(F.lead))}</p><div class="scroll"><table><tr><th></th>${F.colonnes.map(c => `<th>${esc(c.id)}. ${esc(t(c.nom))}</th>`).join("")}</tr>${F.lignes.map(l => `<tr class="${l.total ? "total" : ""}"><td class="rowh">${esc(t(l.k))}</td>${l.v.map(v => `<td>${esc(t(v))}</td>`).join("")}</tr>`).join("")}</table></div>
    <p class="note"><b>${esc(t(F.lecture_t))}</b> ${esc(t(F.lecture))}</p>`;

  const A = D.ateliers;
  const badge = s => `<span class="badge ${s === "devis reçu" ? "devis" : s === "écarté" ? "ecarte" : ""}">${esc(t(A.statuts[s] || s))}</span>`;
  let g = h2(A) + `<p class="lead">${esc(t(A.lead))}</p>`;
  Object.keys(A.groupes).forEach(k => {
    const list = A.items.filter(s => s.groupe === k); if (!list.length) return;
    g += `<h3 class="groupe">${esc(t(A.groupes[k][0]))} <span>${esc(t(A.groupes[k][1]))}</span></h3><div class="cards">`;
    list.forEach(s => {
      const ph = s.photo ? `<img src="${esc(s.photo)}" alt="${esc(s.nom)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML='<div class=none>${esc(t(A.indispo))}</div>'">`
                         : `<div class="none">${esc(s.photoLegende ? t(s.photoLegende) : t(A.visuel))}</div>`;
      g += `<article class="card"><div class="ph">${ph}</div><div class="body">
        <div>${badge(s.statut)}</div><h4>${esc(s.nom)}</h4>
        <div class="lieu"><b>${esc(s.pays)}</b>${esc(t(s.lieu))}${s.contact ? ` · ${esc(s.contact)}` : ""}</div>
        <p>${esc(t(s.moyens))}</p><p class="why">${esc(t(s.pourquoi))}</p>
        ${s.photo ? `<div class="cred">${esc(t(s.photoLegende))} <em>${esc(s.photoCredit)}</em></div>` : ""}
        <div class="links"><a href="${esc(s.site)}" target="_blank" rel="noopener">${esc(t(A.liens.site))} ↗</a><a href="${esc(s.realisations)}" target="_blank" rel="noopener">${esc(t(A.liens.realisations))} ↗</a></div>
        </div></article>`;
    });
    g += `</div>`;
  });
  $("#ateliers").innerHTML = g;

  $("#etapes").innerHTML = `${h2(D.etapes)}<ol>${D.etapes.items.map(e => `<li>${esc(t(e))}</li>`).join("")}</ol>`;
});
</script>
</body>
</html>
